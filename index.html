<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shanthi Towers Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0fff4 0%, #e6fffa 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-8 p-8 bg-gradient-to-br from-emerald-600 to-teal-700 rounded-[2rem] shadow-2xl relative overflow-hidden">
            <h1 class="text-4xl md:text-5xl font-extrabold text-white mb-2 tracking-tight">Shanthi Towers</h1>
            <p class="text-emerald-100 text-lg font-medium mb-4 italic">Bodhan, Telangana</p>
            <div class="h-1.5 w-24 bg-white/40 mx-auto rounded-full mb-4"></div>
            <p class="text-white/90 text-sm max-w-md mx-auto">
                ఏ నంబర్‌కైనా వెంటనే కాల్ చేయడానికి ఆ పేరుపై నొక్కండి.
            </p>
        </header>

        <div class="max-w-md mx-auto mb-10 px-2">
            <div class="relative group">
                <input type="text" id="search-input" onkeyup="filterContacts()" 
                placeholder="పేరు లేదా సర్వీస్ సెర్చ్ చేయండి..." 
                class="w-full p-5 pl-14 rounded-2xl border-none ring-4 ring-emerald-500/10 focus:ring-emerald-500 focus:shadow-2xl outline-none transition-all shadow-xl bg-white/90 text-gray-700">
                <div class="absolute left-5 top-5 text-emerald-500">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
            </div>
        </div>

        <main id="contacts-container" class="grid grid-cols-1 gap-8 mb-16"></main>
        
        <footer class="text-center py-10 border-t border-emerald-200/50 mt-10">
            <p class="text-sm text-emerald-800 font-semibold mb-1">&copy; 2025-2026 Shanthi Towers Directory.</p>
            <p class="text-xs font-medium text-emerald-600/70 tracking-widest uppercase">Powered by DLK Services Private Limited</p>
        </footer>
    </div>

    <script>
        // మీ అసలు డేటా - ఏ వివరాలు మార్చలేదు
        const contacts = {
            "Emergency": [
                { name: "Ambulance", number: "108" },
                { name: "Fire", number: "101" },
                { name: "Police", number: "100" },
                { name: "Health", number: "104" }
            ],
            "Blood Bank/Diagnostics": [
                { name: "Red Cross", number: "08462222002" },
                { name: "Nzb Blood Bank", number: "8367222108" },
                { name: "Aayush", number: "9441089297" },
                { name: "Apollo Diagnostics", number: "8074730997" },
                { name: "Lions Hospital Lab", number: "7702504727"}
            ],
            "Electricity Department": [
                { name: "AAE", number: "8712485392" },
                { name: "Sub Engineer", number: "8712485486" },
                { name: "Line Inspector", number: "8712485384" },
                { name: "Line Man", number: "8639192473" }
            ],
            "Electricians": [
                { name: "Prakash", number: "7013266297" },
                { name: "Muzamil", number: "9398006185" },
                { name: "Nagaraju", number: "9673635700" },
                { name: "Afroz", number: "7306777022" },
                { name: "Yasin", number: "9704746690" },
                { name: "Ramu Rudrur", number: "9949266276" },
                { name: "Santosh", number: "9705058013" },
                { name: "Jeevan Electricals", number: "9440757896" }
            ],
            "Plumbers": [
                { name: "Akhil", number: "9676163806" },
                { name: "Sameer", number: "8187853873" },
                { name: "Kaleem", number: "7013144502" }
            ],
            "AC Mechanics": [
                { name: "Abhilash", number: "9700065662" }
            ],
            "Painters": [
                { name: "Ameer", number: "9701786239" },
                { name: "Sajid", number: "8885992393" },
                { name: "Baba", number: "8328544469" },
                { name: "Prince Store", number: "9849221811" }
            ],
            "Bathroom Cleaners": [
                { name: "Rajaiah", number: "9133754792" },
                { name: "Mohan (Labour)", number: "9912190270" }
            ],
            "Mason (Tiles)": [
                { name: "Bhaskar", number: "9618935751" }
            ],
            "Drivers": [
                { name: "Shiva", number: "7386548776" },
                { name: "Srikanth", number: "9398707850" },
                { name: "Yunus", number: "9391717007" },
                { name: "Raju (Kotgir)", number: "9581796828" }
            ],
            "Catering/Cooking/Milk Centre": [
                { name: "Giri (Minarpally)", number: "9989196727" },
                { name: "Laxmi (Veg)", number: "9908672431" },
                { name: "Khan (Cook)", number: "9908932193" },
                { name: "Afroz Khan (Cook)", number: "9912593888" },
                { name: "Venkata Sai Mess", number: "9490815310" },
                { name: "Sunil Tiffin Centre", number: "9922193888" },
                { name: "Sandeep Milk Centre", number: "7995926350" }
            ],   
            "Water Plants": [
                { name: "Sailu (Sri Sai)", number: "9676848808" },
                { name: "Bala Raju (DMS)", number: "9182020929" }
            ],
            "Executive Committee": [
                { name: "Narayana (President)", number: "9949090459" },
                { name: "Bharath Kumar (Secretary)", number: "9393040749" },
                { name: "Ratan Prasad (Treasurer)", number: "9494959840" },
                { name: "Sai Srinivas (Vice President)", number: "9177782233" },
                { name: "Nagabhushanam (Asst. Secretary)", number: "9908605685" }
            ]
        };

        function callNumber(rawNumber) {
            const cleanNumber = rawNumber.replace(/\D/g, '');
            if (cleanNumber) { window.location.href = `tel:${cleanNumber}`; }
        }

        function filterContacts() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const sections = document.querySelectorAll('section');

            sections.forEach(section => {
                const categoryTitle = section.querySelector('h2').innerText.toLowerCase();
                const contactCards = section.querySelectorAll('.contact-card');
                let hasVisibleContact = false;

                contactCards.forEach(card => {
                    const contactName = card.getAttribute('data-name').toLowerCase();
                    if (contactName.includes(searchTerm) || categoryTitle.includes(searchTerm)) {
                        card.style.display = "block";
                        hasVisibleContact = true;
                    } else { card.style.display = "none"; }
                });
                section.style.display = hasVisibleContact ? "block" : "none";
            });
        }

        function renderContacts() {
            const container = document.getElementById('contacts-container');
            let html = '';

            for (const category in contacts) {
                html += `
                    <section class="bg-white/70 shadow-xl rounded-[2rem] p-6 border border-white transition-all duration-300">
                        <h2 class="text-2xl font-bold text-emerald-800 mb-6 flex items-center border-b border-emerald-100 pb-2">
                            <span class="w-2 h-8 bg-emerald-500 rounded-full mr-3"></span>
                            ${category}
                        </h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                `;

                contacts[category].forEach(contact => {
                    html += `
                        <a href="javascript:void(0)" onclick="callNumber('${contact.number}')" 
                           data-name="${contact.name}"
                           class="contact-card group block p-5 bg-white hover:bg-emerald-600 active:scale-95 rounded-2xl transition-all duration-200 border border-emerald-100 shadow-sm hover:shadow-xl">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-lg font-bold text-gray-800 group-hover:text-white">${contact.name}</p>
                                    <p class="text-sm text-emerald-600 font-medium group-hover:text-emerald-100">${contact.number}</p>
                                </div>
                                <div class="bg-emerald-50 group-hover:bg-white/20 p-3 rounded-xl">
                                    <svg class="w-6 h-6 text-emerald-600 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                                    </svg>
                                </div>
                            </div>
                        </a>
                    `;
                });
                html += `</div></section>`;
            }
            container.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', renderContacts);
    </script>
</body>
</html>
