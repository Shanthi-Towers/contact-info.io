<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shanthi Towers Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0fff4; /* Light Emerald/Green background */
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-6 p-6 bg-white rounded-3xl shadow-2xl border-b-4 border-emerald-500">
            <h1 class="text-4xl font-extrabold text-emerald-700 mb-1">Shanthi Towers</h1>
            <p class="text-gray-600 text-lg font-medium mb-3">Bodhan, Telangana</p>
            <p class="text-gray-500 text-md">Tap any number below for immediate calling to essential services.</p>
        </header>

        <div class="max-w-md mx-auto mb-8">
            <div class="relative">
                <input type="text" id="search-input" onkeyup="filterContacts()" placeholder="Search names or services (e.g. Plumber)..." 
                class="w-full p-4 pl-12 rounded-2xl border-2 border-emerald-100 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition-all shadow-md">
                <div class="absolute left-4 top-4 text-emerald-500">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
            </div>
        </div>

        <main id="contacts-container" class="grid grid-cols-1 gap-6 mb-10"></main>
        
        <footer class="text-center py-6 border-t-2 border-gray-300 mt-6">
            <p class="text-sm text-gray-500 mb-1">
                &copy; 2025-2026 Shanthi Towers Directory. All Rights Reserved.
            </p>
            <p class="text-xs font-medium text-gray-400">
                Powered by DLK Services Private Limited
            </p>
        </footer>
    </div>

    <script>

                { name: "Lions Hospital Lab", number: "7702504727"}
            ],
            "Electricity Department": [
                { name: "AAE", number: "8712485392" },
                { name: "Sub Engineer", number: "8712485486" },
                { name: "Line Inspector", number: "8712485384" },
                { name: "Line Man", number: "8639192473" }
            ],
            "Electricians": [

                { name: "Afroz", number: "7306777022" },
                { name: "Yasin", number: "9704746690" },

                { name: "Jeevan Electricals", number: "9440757896" }

            "Plumbers": [

            ],

            ],

                { name: "Sajid", number: "8885992393" },
                { name: "Baba", number: "8328544469" },
                { name: "Prince Store", number: "9849221811" }
            ],
            "Bathroom Cleaners": [
                { name: "Rajaiah", number: "9133754792" },
                { name: "Mohan (Labour)", number: "9912190270" }
            ],
            "Mason (Tiles)": [
                { name: "Bhaskar", number: "9618935751" }
            ],
            "Drivers": [
                { name: "Shiva", number: "7386548776" },

            ],
            "Catering/Cooking/Milk Centre": [
                { name: "Giri (Minarpally)", number: "9989196727" },
                { name: "Laxmi (Veg)", number: "9908672431" },
                { name: "Khan (Cook)", number: "9908932193" },
                { name: "Afroz Khan (Cook)", number: "9912593888" },

            ],   
            "Water Plants": [

            ],

                { name: "Bharath Kumar (Secretary)", number: "9393040749" },
                { name: "Ratan Prasad (Treasurer)", number: "9494959840" },
                { name: "Sai Srinivas (Vice President)", number: "9177782233" },
                { name: "Nagabhushanam (Asst. Secretary)", number: "9908605685" }
            ]
        };

        function callNumber(rawNumber) {
            const cleanNumber = rawNumber.replace(/\D/g, '');
            if (cleanNumber) {
                window.location.href = `tel:${cleanNumber}`;
            }
        }

        // --- Filter Functionality ---
        function filterContacts() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const sections = document.querySelectorAll('section');

            sections.forEach(section => {
                const categoryTitle = section.querySelector('h2').innerText.toLowerCase();
                const contactCards = section.querySelectorAll('.contact-card');
                let hasVisibleContact = false;

                contactCards.forEach(card => {
                    const contactName = card.getAttribute('data-name').toLowerCase();
                    if (contactName.includes(searchTerm) || categoryTitle.includes(searchTerm)) {
                        card.style.display = "block";
                        hasVisibleContact = true;
                    } else {
                        card.style.display = "none";
                    }
                });
                section.style.display = hasVisibleContact ? "block" : "none";
            });
        }

        function renderContacts() {
            const container = document.getElementById('contacts-container');
            let html = '';

            for (const category in contacts) {
                if (contacts.hasOwnProperty(category)) {
                    const contactsList = contacts[category];

                    html += `
                        <section class="bg-white shadow-xl rounded-xl p-5 border-t-4 border-emerald-500 transition duration-300 hover:shadow-2xl">
                            <h2 class="text-2xl font-bold text-emerald-700 mb-4 pb-2 border-b-2 border-emerald-100">${category}</h2>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    `;

                    contactsList.forEach(contact => {
                        html += `
                            <a href="javascript:void(0)" onclick="callNumber('${contact.number}')" 
                               data-name="${contact.name}"
                               class="contact-card group block p-4 bg-gray-50 hover:bg-emerald-50 active:scale-95 active:bg-emerald-100 rounded-lg transition duration-200 border border-gray-200 shadow-md">
                                <div class="flex items-center justify-between">
                                    <div>
                                        <p class="text-lg font-semibold text-gray-800 group-hover:text-emerald-800">${contact.name}</p>
                                        <p class="text-sm text-gray-500">${contact.number}</p>
                                    </div>
                                    <svg class="w-6 h-6 text-emerald-500 group-hover:text-emerald-600 transform group-hover:scale-110 transition duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                                    </svg>
                                </div>
                            </a>
                        `;
                    });

                    html += `</div></section>`;
                }
            }
            container.innerHTML = html;
        }

        window.callNumber = callNumber;
        document.addEventListener('DOMContentLoaded', renderContacts);
    </script>
</body>
</html>
