<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shanthi Towers Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0fff4 0%, #e6fffa 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-8 p-8 bg-gradient-to-br from-emerald-600 to-teal-700 rounded-[2rem] shadow-2xl transform hover:scale-[1.01] transition-all duration-300 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#FFFFFF" d="M44.7,-76.4C58.1,-69.2,69.2,-58.1,76.4,-44.7C83.6,-31.3,86.9,-15.7,85.3,-0.9C83.7,13.8,77.1,27.7,68.2,39.5C59.3,51.3,48,61.1,35.1,68.4C22.2,75.7,7.7,80.5,-7.1,78.2C-21.9,75.9,-36.9,66.5,-49,55.1C-61.1,43.7,-70.3,30.3,-75.4,15.5C-80.5,0.7,-81.5,-15.5,-76.1,-29.6C-70.7,-43.7,-58.9,-55.7,-45.3,-63C-31.7,-70.3,-15.9,-72.9,0,-72.9C15.9,-72.9,31.3,-70.3,44.7,-76.4Z" transform="translate(100 100)" />
                </svg>
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold text-white mb-2 tracking-tight">Shanthi Towers</h1>
            <p class="text-emerald-100 text-lg font-medium mb-4 italic">Bodhan, Telangana</p>
            <div class="h-1.5 w-24 bg-white/40 mx-auto rounded-full mb-4"></div>
            <p class="text-white/90 text-sm leading-relaxed max-w-md mx-auto">
                మీకు అవసరమైన సేవలను సులభంగా కనుగొనండి. నంబర్‌పై నొక్కి నేరుగా కాల్ చేయండి.
            </p>
        </header>

        <div class="max-w-md mx-auto mb-10 px-2">
            <div class="relative group">
                <input type="text" id="search-input" onkeyup="filterContacts()" 
                placeholder="Search for names or services..." 
                class="w-full p-5 pl-14 rounded-2xl border-none ring-4 ring-emerald-500/10 focus:ring-emerald-500 focus:shadow-2xl outline-none transition-all shadow-xl bg-white/90 backdrop-blur-sm text-gray-700">
                <div class="absolute left-5 top-5 text-emerald-500 group-focus-within:scale-110 transition-transform">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
            </div>
        </div>

        <main id="contacts-container" class="grid grid-cols-1 gap-8 mb-16"></main>
        
        <footer class="text-center py-10 border-t border-emerald-200/50 mt-10 bg-white/30 rounded-t-[3rem]">
            <p class="text-sm text-emerald-800 font-semibold mb-1">
                &copy; 2025-2026 Shanthi Towers Directory.
            </p>
            <p class="text-xs font-medium text-emerald-600/70 tracking-widest uppercase">
                Powered by DLK Services Private Limited
            </p>
        </footer>
    </div>

    <script>
        const contacts = {
            "Emergency Services": [
                { name: "Ambulance", number: "108" },
                { name: "Fire", number: "101" },
                { name: "Police", number: "100" },
                { name: "Health Helpline", number: "104" }
            ],
            "Blood Bank & Diagnostics": [
                { name: "Red Cross Blood Bank", number: "08462222002" },
                { name: "Nzb Blood Bank", number: "8367222108" },
                { name: "Aayush Diagnostics", number: "9441089297" },
                { name: "Apollo Diagnostics", number: "8074730997" },
                { name: "Lions Hospital Lab", number: "7702504727"}
            ],
            "Electricity Dept": [
                { name: "AAE Office", number: "8712485392" },
                { name: "Sub Engineer", number: "8712485486" },
                { name: "Line Inspector", number: "8712485384" },
                { name: "Line Man", number: "8639192473" }
            ],
            "Electricians": [
                { name: "Muzamil", number: "9398006185" },
                { name: "Nagaraju", number: "9673635700" },
                { name: "Afroz", number: "7306777022" },
                { name: "Yasin", number: "9704746690" },
                { name: "Ramu Rudrur", number: "9949266276" },
                { name: "Santosh", number: "9705058013" },
                { name: "Jeevan Electricals", number: "9440757896" }
            ],
            "Plumbing Works": [
                { name: "Akhil", number: "9676163806" },
                { name: "Sameer", number: "8187853873" },
                { name: "Kaleem", number: "7013144502" }
            ],
            "Other Services": [
                { name: "Abhilash (AC Mech)", number: "9700065662" },
                { name: "Bhaskar (Tiles Mason)", number: "9618935751" },
                { name: "Ameer (Painter)", number: "9701786239" },
                { name: "Rajaiah (Cleaning)", number: "9133754792" }
            ],
            "Drivers": [
                { name: "Shiva", number: "7386548776" },
                { name: "Srikanth", number: "9398707850" },
                { name: "Yunus", number: "9391717007" },
                { name: "Raju (Kotgir)", number: "9581796828" }
            ],
            "Food & Milk": [
                { name: "Giri (Catering)", number: "9989196727" },
                { name: "Laxmi (Veg Meals)", number: "9908672431" },
                { name: "Sunil Tiffin Centre", number: "9922193888" },
                { name: "Sandeep Milk", number: "7995926350" }
            ],
            "Water Supply": [
                { name: "Sailu (Sri Sai)", number: "9676848808" },
                { name: "Bala Raju (DMS)", number: "9182020929" }
            ],
            "Executive Committee": [
                { name: "Narayana (President)", number: "9949090459" },
                { name: "Bharath (Secretary)", number: "9393040749" },
                { name: "Ratan (Treasurer)", number: "9494959840" },
                { name: "Sai Srinivas (VP)", number: "9177782233" }
            ]
        };

        function callNumber(rawNumber) {
            const cleanNumber = rawNumber.replace(/\D/g, '');
            if (cleanNumber) { window.location.href = `tel:${cleanNumber}`; }
        }

        function filterContacts() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const sections = document.querySelectorAll('section');

            sections.forEach(section => {
                const categoryTitle = section.querySelector('h2').innerText.toLowerCase();
                const contactCards = section.querySelectorAll('.contact-card');
                let hasVisibleContact = false;

                contactCards.forEach(card => {
                    const contactName = card.getAttribute('data-name').toLowerCase();
                    if (contactName.includes(searchTerm) || categoryTitle.includes(searchTerm)) {
                        card.style.display = "block";
                        hasVisibleContact = true;
                    } else { card.style.display = "none"; }
                });
                section.style.display = hasVisibleContact ? "block" : "none";
            });
        }

        function renderContacts() {
            const container = document.getElementById('contacts-container');
            let html = '';

            for (const category in contacts) {
                html += `
                    <section class="bg-white/60 shadow-xl rounded-[2rem] p-6 border border-white transition-all duration-300">
                        <h2 class="text-2xl font-bold text-emerald-800 mb-6 flex items-center">
                            <span class="w-2 h-8 bg-emerald-500 rounded-full mr-3"></span>
                            ${category}
                        </h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                `;

                contacts[category].forEach(contact => {
                    html += `
                        <a href="javascript:void(0)" onclick="callNumber('${contact.number}')" 
                           data-name="${contact.name}"
                           class="contact-card group block p-5 bg-white hover:bg-emerald-600 active:scale-95 rounded-2xl transition-all duration-200 border border-emerald-100 shadow-sm hover:shadow-emerald-200 hover:shadow-xl">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-lg font-bold text-gray-800 group-hover:text-white transition-colors">${contact.name}</p>
                                    <p class="text-sm text-emerald-600 font-medium group-hover:text-emerald-100 transition-colors">${contact.number}</p>
                                </div>
                                <div class="bg-emerald-50 group-hover:bg-white/20 p-3 rounded-xl transition-colors">
                                    <svg class="w-6 h-6 text-emerald-600 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                                    </svg>
                                </div>
                            </div>
                        </a>
                    `;
                });
                html += `</div></section>`;
            }
            container.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', renderContacts);
    </script>
</body>
</html>
